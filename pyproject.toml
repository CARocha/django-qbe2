[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-qbe2"
version = "0.1.0a13"
description = "A reusable Django app for authorized query-by-example reports."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos A. Rocha" }]
dependencies = ["Django>=6.0,<6.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]

[project.urls]
Documentation = "https://github.com/CARocha/django-qbe2/tree/main/docs"
Repository = "https://github.com/CARocha/django-qbe2"
Issues = "https://github.com/CARocha/django-qbe2/issues"

[dependency-groups]
dev = ["openpyxl>=3.1,<4", "ruff>=0.11", "psycopg[binary]>=3.2.10"]
docs = [
    "sphinx>=8.2,<10",
]
release = [
    "hatchling>=1.27,<2",
    "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/django_qbe2"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src/django_qbe2", "pyproject.toml", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
