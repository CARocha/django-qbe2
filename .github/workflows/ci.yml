name: CI

on:
  workflow_call:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.24"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --only-group docs
      - run: uv run --only-group docs sphinx-build -n -W -b html docs/source docs/_build/html
      - run: uv run --only-group docs sphinx-build -n -W -b text docs/source docs/_build/text

  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.24"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv audit --locked --preview-features audit-command
      - run: uv run python -m django test tests --settings=tests.settings -v 2
      - run: uv run python demo/manage.py test demo.reports -v 2
      - run: uv run python demo/manage.py check
      - run: uv run python demo/manage.py makemigrations --check --dry-run
      - run: uv build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qbe2_tests
          POSTGRES_USER: qbe2_ci
          # Disposable synthetic test data; loopback-only, no repository secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QBE2_TEST_DB: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: qbe2_tests
      PGUSER: qbe2_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.24"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python -m django test tests --settings=tests.settings -v 2
      - run: uv run python demo/manage.py test demo.reports -v 2
